# release-please: cut versioned releases from conventional commits on main,
# then attach prebuilt binaries (linux and darwin, amd64 and arm64) to each
# release (public assets; linux-amd64 is also the Amp post-install script's).
#
# Flow: push conventional commits (feat:/fix:) to main → release-please opens/
# updates the release PR → merge it → this workflow tags the release, builds
# the binary and uploads it as release assets.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go

  release-binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    env:
      PLATFORM: ${{ matrix.goos }}-${{ matrix.goarch }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/dehydr8/cproxy/internal/version.Version=${TAG}" -o dist/cproxy .
          if [ "$PLATFORM" = linux-amd64 ]; then ./dist/cproxy version; fi
      - name: package
        run: |
          cp README.md dist/
          # Versioned name for humans browsing releases; versionless name is
          # the stable URL used by the README and Amp post-install script
          # (releases/latest/download/cproxy-<os>-<arch>.tar.gz).
          for name in "cproxy-${TAG}-${PLATFORM}" "cproxy-${PLATFORM}"; do
            tar -czf "${name}.tar.gz" -C dist cproxy README.md
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          done
      - name: upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "cproxy-${TAG}-${PLATFORM}.tar.gz" "cproxy-${TAG}-${PLATFORM}.tar.gz.sha256" \
            "cproxy-${PLATFORM}.tar.gz" "cproxy-${PLATFORM}.tar.gz.sha256" \
            --clobber
