# release-please: cut versioned releases from conventional commits on main,
# then attach the prebuilt linux/amd64 binary to each release (public asset,
# also consumed by the Amp post-install script in README.md).
#
# Flow: push conventional commits (feat:/fix:) to main → release-please opens/
# updates the release PR → merge it → this workflow tags the release, builds
# the binary and uploads it as release assets.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go

  release-linux-amd64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/dehydr8/cproxy/internal/version.Version=${{ needs.release-please.outputs.tag_name }}" -o dist/cproxy .
          ./dist/cproxy version
      - name: package
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          cp README.md dist/
          # Versioned name for humans browsing releases; versionless name is
          # the stable URL used by the README and Amp post-install script
          # (releases/latest/download/…).
          for name in "cproxy-${tag}-linux-amd64" cproxy-linux-amd64; do
            tar -czf "${name}.tar.gz" -C dist cproxy README.md
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          done
      - name: upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            cproxy-"$TAG"-linux-amd64.tar.gz cproxy-"$TAG"-linux-amd64.tar.gz.sha256 \
            cproxy-linux-amd64.tar.gz cproxy-linux-amd64.tar.gz.sha256 \
            --clobber
